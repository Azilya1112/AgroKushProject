services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: agro_kush
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d agro_kush"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    # Loopback only: the browser reaches the API through the frontend's proxy, so this
    # is here purely for `npm run dev` and for debugging with curl. Drop it in production.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/agro_kush
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    depends_on:
      db:
        condition: service_healthy

  # Serves the SPA and proxies /api/* to the backend, so the browser only ever talks
  # to one origin. Built with an empty VITE_API_URL (the Dockerfile default), which is
  # what makes the image environment-independent.
  frontend:
    build:
      context: ../agro-kush-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
